app = "milesminder"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  DB_PATH = "/data/milesminder.db"
  REWARD_VIDEOS_DIR = "/app/assets/rewards"


[processes]
  app = "python -m milesminder.bot"

[mounts]
  source = "milesminder_data"
  destination = "/data"

# IMPORTANT: No [[services]] block at all.
# (Discord bots don't expose HTTP; health checks will otherwise fail.)
